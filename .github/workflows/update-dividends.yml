name: Update dividend history

on:
  schedule:
    # 01:15 UTC = 07:00 NPT (UTC+5:45), every day
    - cron: "15 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pick-runner:
    # Use the home server while its heartbeat is fresh; otherwise fall back to GitHub-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          HEARTBEAT: ${{ vars.SERVER_HEARTBEAT }}
        run: |
          runner=self-hosted
          if [[ "$HEARTBEAT" =~ ^[0-9]+$ ]] && [ $(( $(date +%s) - HEARTBEAT )) -gt 600 ]; then
            runner=ubuntu-latest
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "Runner: $runner (heartbeat: ${HEARTBEAT:-unset})" >> "$GITHUB_STEP_SUMMARY"

  update:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Playwright system deps (GitHub-hosted fallback only)
        if: needs.pick-runner.outputs.runner == 'ubuntu-latest'
        run: sudo env "PATH=$PATH" playwright install-deps chromium

      - run: playwright install chromium

      - run: python fetch_dividends.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dividend_history.csv right_share_history.csv
          git diff --cached --quiet || git commit -m "Update dividend and right share history"
          git push
